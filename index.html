<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 개인 가계부 - 대시보드</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.min.js"></script>
  
  <link rel="stylesheet" href="my.css">
  
  <style>
    .fc a {
      color: var(--text-primary) !important;
      text-decoration: none !important;
    }
    .fc-col-header-cell-cushion {
      font-weight: 600;
      padding: 8px 0 !important;
    }
    .fc-daygrid-day-number {
      font-size: 0.9rem;
      padding: 4px 8px !important;
    }
    .fc-day-selected {
      background-color: rgba(79, 70, 229, 0.08) !important;
    }
    .day-sum-income {
      font-size: 0.75rem;
      color: #10b981;
      font-weight: bold;
      margin-top: 2px;
    }
    .day-sum-expense {
      font-size: 0.75rem;
      color: #ef4444;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">💰 SmartLedger</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">대시보드</a></li>
          <li class="nav-item"><a class="nav-link" href="add.html">내역 추가</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="main-wrapper">
    <div class="container">
      <div class="row g-3 mb-4">
        <div class="col-12 col-md-4">
          <div class="card stat-card income">
            <div class="card-body">
              <span class="text-muted fs-6">이번 달 총 수입</span>
              <div class="stat-amount income mt-1">+ 3,500,000 원</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card stat-card expense">
            <div class="card-body">
              <span class="text-muted fs-6">이번 달 총 지출</span>
              <div class="stat-amount expense mt-1">- 1,245,000 원</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card stat-card">
            <div class="card-body">
              <span class="text-muted fs-6">현재 순 잔액</span>
              <div class="stat-amount mt-1">2,255,000 원</div>
            </div>
          </div>
        </div>
      </div>
      <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>📅 일별 입출금 캘린더</span>
          <small class="text-muted">날짜를 클릭하면 하단에서 해당 일자의 상세 내역을 확인할 수 있습니다.</small>
        </div>
        <div class="card-body p-3">
          <div id="calendar"></div>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h5 class="fw-bold m-0" id="selected-date-title">전체 내역 목록</h5>
          <p class="text-muted mb-0 small" id="selected-date-count">날짜를 선택하여 일별 내역을 확인하세요.</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-secondary" onclick="resetFilter()">전체보기</button>
          <a href="add.html" class="btn btn-primary d-inline-flex align-items-center gap-1">+ 내역 추가</a>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>날짜</th>
              <th>구분</th>
              <th>내역명</th>
              <th>카테고리</th>
              <th>결제수단</th>
              <th class="text-end">금액</th>
              <th class="text-center">상세보기</th>
            </tr>
          </thead>
          <tbody id="transaction-list">
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <footer class="text-center">
    <div class="container">
      <p class="mb-0">© 2026 SmartLedger. Frontend CRUD Service Project.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const mockData = [
      { id: 1, date: '2026-09-01', type: 'income', title: '9월 정기 급여', category: '급여', method: '계좌이체', amount: 3500000 },
      { id: 2, date: '2026-09-02', type: 'expense', title: '점심 식사 (김치찌개)', category: '식비', method: '체크카드', amount: 10000 },
      { id: 3, date: '2026-09-02', type: 'expense', title: '저녁 회식', category: '식비', method: '신용카드', amount: 45000 },
      { id: 4, date: '2026-09-03', type: 'expense', title: '지하철 충전', category: '교통', method: '신용카드', amount: 50000 },
      { id: 5, date: '2026-09-05', type: 'expense', title: '온라인 서점 도서 구매', category: '쇼핑/교양', method: '신용카드', amount: 35000 }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      renderTable(mockData); // 초기에는 전체 데이터 표시

      const calendarEl = document.getElementById('calendar');
      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        initialDate: '2026-09-01',
        locale: 'ko',
        height: 'auto',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: ''
        },
        dateClick: function(info) {
          const selectedDate = info.dateStr;
          const filteredData = mockData.filter(item => item.date === selectedDate);
          
          document.getElementById('selected-date-title').innerText = `${selectedDate} 내역`;
          document.getElementById('selected-date-count').innerText = `총 ${filteredData.length}건의 내역이 있습니다.`;
          
          renderTable(filteredData);
        }
      });
      calendar.render();
    });

    function renderTable(data) {
      const tbody = document.getElementById('transaction-list');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">선택한 날짜에 입출금 내역이 없습니다.</td></tr>`;
        return;
      }

      data.forEach(item => {
        const isIncome = item.type === 'income';
        const badgeClass = isIncome ? 'badge-income' : 'badge-expense';
        const amountClass = isIncome ? 'text-success' : 'text-danger';
        const prefix = isIncome ? '+' : '-';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.date}</td>
          <td><span class="${badgeClass}">${isIncome ? '수입' : '지출'}</span></td>
          <td class="fw-bold">${item.title}</td>
          <td>${item.category}</td>
          <td>${item.method}</td>
          <td class="text-end fw-bold ${amountClass}">${prefix} ${item.amount.toLocaleString()} 원</td>
          <td class="text-center"><a href="view.html" class="btn btn-sm btn-outline-secondary">보기</a></td>
        `;
        tbody.appendChild(tr);
      });
    }
    
    function resetFilter() {
      document.getElementById('selected-date-title').innerText = '전체 내역 목록';
      document.getElementById('selected-date-count').innerText = `총 ${mockData.length}건의 내역이 있습니다.`;
      renderTable(mockData);
    }
  </script>
</body>
</html>
