<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 개인 가계부 - 내역 상세</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="my.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">💰 SmartLedger</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">대시보드</a></li>
          <li class="nav-item"><a class="nav-link" href="add.html">내역 추가</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="main-wrapper">
    <div class="container" style="max-width: 680px;">
      <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
          <h5 class="fw-bold m-0">📄 입출금 내역 상세 정보</h5>
          <span class="badge-expense fs-6">지출</span>
        </div>
        
        <div class="card-body p-4">
          <div class="text-center py-3 mb-4 rounded-3 style-amount-box" style="background-color: #f8fafc; border: 1px dashed var(--border-color);">
            <span class="text-muted small d-block mb-1">결제 금액</span>
            <span class="fs-2 fw-bold text-danger">- 10,000 원</span>
          </div>
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="text-muted small d-block">거래 ID</label>
              <span class="fw-semibold">TX-20260902-01</span>
            </div>

            <div class="col-12 col-md-6">
              <label class="text-muted small d-block">거래일자</label>
              <span class="fw-semibold">2026-09-02</span>
            </div>

            <div class="col-12">
              <label class="text-muted small d-block">내역명</label>
              <span class="fw-semibold fs-5">점심 식사 (김치찌개)</span>
            </div>

            <div class="col-12 col-md-6">
              <label class="text-muted small d-block">카테고리</label>
              <span class="badge bg-secondary bg-opacity-10 text-secondary border px-2 py-1">식비</span>
            </div>

            <div class="col-12 col-md-6">
              <label class="text-muted small d-block">결제수단</label>
              <span class="fw-semibold">체크카드</span>
            </div>

            <div class="col-12">
              <hr class="my-2 text-muted opacity-25">
              <label class="text-muted small d-block mb-1">상세 메모</label>
              <div class="p-3 bg-light rounded-2 text-secondary" style="font-size: 0.95rem;">
                팀원들과 점심 식사로 강남식당에서 김치찌개 결제함.
              </div>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
            <a href="index.html" class="btn btn-outline-secondary">목록으로</a>
            
            <div class="d-flex gap-2">
              <a href="edit.html" class="btn btn-primary">수정 (Edit)</a>
              <button type="button" class="btn btn-danger" onclick="deleteRecord()">삭제 (Delete)</button>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <footer class="text-center">
    <div class="container">
      <p class="mb-0">© 2026 SmartLedger. Frontend CRUD Service Project.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function deleteRecord() {
      const isConfirmed = confirm('이 가계부 내역을 정말로 삭제하시겠습니까?\n삭제된 데이터는 복구할 수 없습니다.');
      
      if (isConfirmed) {
        alert('내역이 성공적으로 삭제되었습니다.');
        window.location.href = 'index.html'; 
      }
    }
  </script>
</body>
</html>
